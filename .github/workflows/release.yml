name: Release images

# Builds the production images in CI and publishes them to GitHub Container
# Registry, so the VPS only ever pulls. Building on the server itself is the
# alternative, and on a 4 GB box the Next.js build (2 GB+ on its own, alongside
# Postgres and Redis already running) can get OOM-killed partway through.
#
# Runs after CI passes on main, so a red build never produces a pullable tag.
# Also runnable by hand for a specific commit or a one-off tag.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish alongside the commit SHA (e.g. v1.2.0)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    # workflow_run fires on failure too — only build what actually passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, which may
          # have moved on — pin to the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects mixed-case image names and the owner here is "Sethmmoja".
      - name: Lowercase the image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_API_URL is inlined into the browser bundle at build time.
      # If the repository variable is unset this would silently fall back to
      # the Dockerfile's localhost default and publish an image whose every
      # API call points at the visitor's own machine — so fail here instead.
      - name: Require NEXT_PUBLIC_API_URL for the web image
        if: matrix.app == 'web'
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_API_URL is not set." \
                 "Set it under Settings → Secrets and variables → Actions → Variables" \
                 "to https://api.relatax.org/api/v1 before publishing web images."
            exit 1
          fi

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/relatax-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfiles prune the monorepo, so the build context is the
          # repository root, not the app directory.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
