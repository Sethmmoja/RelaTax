# Production stack for a single VPS: Postgres + Redis + API + web + TLS proxy.
#
# Unlike infra/docker-compose.yml (local infra only, apps run natively via
# `pnpm dev`), this runs everything. Object storage is NOT here — production
# uses Cloudflare R2, configured through STORAGE_* in prod.env.
#
#   cp prod.env.example prod.env   # then fill it in
#   docker compose --env-file prod.env -f docker-compose.prod.yml up -d --build
#
# Postgres and Redis deliberately publish no ports: they're reachable only on
# the internal compose network, so the VPS never exposes a database to the
# internet even if ufw is misconfigured.

name: relatax-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in prod.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in prod.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: relatax-api:${RELEASE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - prod.env
    environment:
      # Override whatever prod.env says for these two — inside the compose
      # network the database and cache are reachable by service name, never
      # localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time — changing it later needs
        # a rebuild (`up -d --build`), not just a restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in prod.env}
    image: relatax-web:${RELEASE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
